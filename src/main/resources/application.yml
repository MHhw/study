spring:
  application:
    name: project-one

  # PostgreSQL DataSource Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/one
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false # Hibernate가 직접 SQL을 콘솔에 출력하는 것을 비활성화 (로거를 통해 제어)
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 포맷팅
        # show_sql: true # 이 옵션 대신 아래 로거 설정을 사용하는 것이 더 유연합니다.
    # defer-datasource-initialization: true # 데이터베이스 초기화 지연 (필요시 사용)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
            scope:
              - read:user
              - user:email
        provider:
          google:
            issuer-uri: https://accounts.google.com
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

jwt:
  # Base64 인코딩된 256비트 이상의 비밀키 (운영 환경에서는 환경 변수로 관리 권장)
  secret: ZHVtbXktc2VjcmV0LXN0cmluZy1zaG91bGQtYmUtYmFzZTY0LWRlY29kZWQ=
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600

# 로깅 레벨 설정
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG       # 실행되는 SQL 쿼리문을 DEBUG 레벨로 출력
        type.descriptor.sql: TRACE # SQL 바인딩 파라미터 값을 TRACE 레벨로 출력
        orm.jdbc.bind: TRACE # Hibernate 6+ 에서 바인딩 파라미터 로깅 (위의 것이 안될 경우 시도)
